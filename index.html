<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>STREET SURVIVAL β0.2</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="app-header">
    <div>
      <h1>STREET SURVIVAL β0.2</h1>
      <p>歩くと動く。街がフィールドになる。</p>
    </div>
    <button id="resetBtn" class="ghost">リセット</button>
  </header>

  <main class="layout">
    <section class="card">
      <div class="row between">
        <div>
          <h2>あなた</h2>
          <p class="muted">プレイヤー名：<input id="playerName" value="RED" /></p>
        </div>
        <span id="liveBadge" class="badge hidden">LIVE</span>
      </div>

      <div class="hp-block">
        <div class="row between">
          <strong>HP</strong>
          <span id="hpText">100 / 100</span>
        </div>
        <div class="bar"><div id="hpBar" class="bar-fill"></div></div>
      </div>

      <div class="stats">
        <div><span id="points">0</span><small>POINT</small></div>
        <div><span id="kills">0</span><small>撃破</small></div>
        <div><span id="shield">OFF</span><small>バリア</small></div>
      </div>

      <button id="liveToggle" class="primary">配信ブースト OFF</button>
      <button id="gpsBtn" class="secondary">📍 GPS現在地を取得</button>
      <p id="gpsStatus" class="hint">GPS未取得。iPhone Safariで開いて位置情報を許可してください。</p>
      <p class="hint">配信ON：HP吸収 +10% / ポイント +5%。ただしLIVE表示で目立つ。</p>
    </section>

    <section class="card">
      <h2>地図フィールド</h2>
      <div id="map"></div>
      <div class="controls">
        <button data-move="up">↑</button>
        <button data-move="left">←</button>
        <button data-move="down">↓</button>
        <button data-move="right">→</button>
      </div>
      <p class="hint">GPSが使えない時はテスト移動ボタンで確認できます。</p>
    </section>

    <section class="card">
      <h2>店舗スポット</h2>
      <div id="shops" class="shop-list"></div>
    </section>

    <section class="card">
      <h2>参加者</h2>
      <div id="players" class="player-list"></div>
    </section>

    <section class="card wide">
      <h2>運営ログ</h2>
      <div id="log" class="log"></div>
    </section>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="app.js"></script>
</body>
</html>
